set -wg mode-keys vi
set -g mouse off
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Status bar / tab bar
set -g status on
set -g status-position bottom
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g status-interval 5
set -g status-left ""
set -g status-style "#{?client_prefix,bg=yellow fg=black,bg=green fg=black}"
set -g status-right-length 200
set -g status-right " #[bold]#S "
set -g window-status-format         " #I: #W "
set -g window-status-current-format " #I: #W "
set -g window-status-current-style  "bold,reverse"

# use newer encoding standard
# set -g extended-keys-format csi-u

# New session with name prompt
bind S display-popup -E "~/.config/tmux/new-session.sh"

# Move current window to another session
bind . display-popup -E "~/.config/tmux/move-window.sh"

# tmux-sessionizer (project/session picker)
bind f run-shell "~/.config/tmux/tmux-sessionizer-launcher.sh"

# Persistent floating shell (session "float" stays alive after closing)
bind - display-popup -E "tmux new-session -A -s scratch -c '#{pane_current_path}'"

# Prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Cross-platform clipboard: pbcopy (macOS) / xsel (Linux)
if-shell "command -v pbcopy" 'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"'
if-shell "! command -v pbcopy" 'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xsel -i -b"'

bind x kill-pane

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Plugins
set -g @plugin 'tmux-plugins/tpm'

run '~/.tmux/plugins/tpm/tpm'
