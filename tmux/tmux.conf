set -wg mode-keys vi
set -g mouse off
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Status bar / tab bar
set -g status on
set -g status-position bottom
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g status-interval 5
set -g status-left ""
set -g status-style "#{?client_prefix,bg=yellow fg=black,bg=green fg=black}"
set -g status-right-length 200
set -g status-right " #[fg=black]⎇ #(cd #{pane_current_path} && git rev-parse --abbrev-ref HEAD 2>/dev/null)  #(~/.tmux/kube-tmux/kube.tmux 0 black black)  ☁ #(tmux show-environment AWS_PROFILE 2>/dev/null | cut -d= -f2 || echo default)#[default]  #[bold]#S "
set -g window-status-format         " #I: #W "
set -g window-status-current-format " #I: #W "
set -g window-status-current-style  "bold,reverse"

# Project picker (mirrors kitty's cmd+p / projects.py)
bind P run-shell "~/.config/tmux/projects-launcher.sh"

# Fuzzy session/window switcher
bind s display-popup -E "~/.config/tmux/switch-session.sh"

# New session with name prompt
bind S display-popup -E "~/.config/tmux/new-session.sh"

# Move current window to another session
bind . display-popup -E "~/.config/tmux/move-window.sh"

# AWS profile picker
bind A display-popup -E "~/.config/tmux/aws-profile.sh"



# Prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

bind x kill-pane

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

run '~/.tmux/plugins/tpm/tpm'
